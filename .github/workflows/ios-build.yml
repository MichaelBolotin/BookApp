name: iOS build

on:
  push:
    branches:
      - codex/book-reading-gemini-20260928
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator app
        run: xcodebuild -project BookApp.xcodeproj -scheme BookApp -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Launch app without iCloud entitlement
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/BookApp.app' -type d | head -n 1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          LAUNCH_RESULT=$(xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID")
          APP_PID=${LAUNCH_RESULT##*: }
          sleep 5
          kill -0 "$APP_PID"
